<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoxBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fff4e0; --bg2:#f6dbb0; --ink:#3b2412; --card:#fffcf5; --accent:#d62828;
    --box:#c99a5b; --line:#e3c58f; --purple:#6f2dbd; --purple-dark:#561fa0;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:'Fredoka',system-ui,sans-serif; color:var(--ink);
    background:radial-gradient(circle at 30% 20%,var(--bg1),var(--bg2));
    display:flex; flex-direction:column;
  }
  header{display:flex;align-items:center;gap:10px;padding:10px 18px;flex-wrap:wrap}
  header h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.4px}
  header h1 span{color:var(--accent)}
  .spacer{flex:1}
  .pill{font-size:13px;padding:5px 12px;border-radius:99px;background:#fff;border:2px solid var(--line);font-weight:500}
  #status.live{background:#ffe3e3;border-color:#f3a3a3}
  #status.wake{background:#e6f7ed;border-color:#8fd1a8}
  #langSelect{
    font:inherit;font-size:13px;font-weight:500;color:var(--ink);
    padding:4px 10px;border-radius:99px;background:#fff;border:2px solid var(--line);
    cursor:pointer;outline:none;
  }
  #langSelect:hover,#langSelect:focus{border-color:var(--ink)}
  .toggle{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none;background:#fff;padding:4px 10px;border-radius:99px;border:2px solid var(--line)}

  /* Main layout: Left Nav + Stage + Optional Skins Panel + Chat */
  main{
    flex:1;min-height:0;
    display:grid;
    grid-template-columns:126px 1fr 330px;
    gap:14px;padding:0 18px 14px;
  }
  main.skins-open{
    grid-template-columns:126px 1fr 336px 320px;
  }

  /* Left vertical nav */
  .nav-rail{
    background:var(--card);border:2.5px solid var(--line);border-radius:20px;
    padding:10px 8px;display:flex;flex-direction:column;gap:8px;align-self:start;
    box-shadow:0 4px 14px rgba(59,36,18,.06);
  }
  .nav-btn{
    font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);
    background:transparent;border:none;border-radius:13px;padding:10px 10px;
    display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left;
    transition:all .15s;
  }
  .nav-btn:hover{background:#f5e6cc}
  .nav-btn.active{background:var(--purple);color:#fff;box-shadow:0 3px 8px rgba(111,45,189,.28)}
  .nav-ico{font-size:16px;width:20px;text-align:center}

  /* Stage: shifted avatar & emotion chips higher + enlarged avatar */
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:0;padding-top:0;position:relative}
  #bubble{
    position:relative;width:min(540px,100%);min-height:60px;max-height:118px;overflow:auto;
    background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 16px;
    font-size:16.5px;line-height:1.35;margin-bottom:8px;box-shadow:0 5px 0 rgba(59,36,18,.15);
    transition:transform .25s ease; z-index:2;
  }
  #bubble::after{content:"";position:absolute;left:50%;bottom:-15px;width:18px;height:18px;background:#fff;
    border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
  .cursor::after{content:"▍";animation:blinkc .8s steps(2) infinite;opacity:.6}
  @keyframes blinkc{50%{opacity:0}}

  .stage-mid{
    flex:0 1 auto;min-height:0;width:100%;display:flex;align-items:flex-start;justify-content:center;
    position:relative;margin-top:-12px;
  }
  .quick-tools{
    position:absolute;left:6px;top:46%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:8px;z-index:3;
  }
  .qtool{
    width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:#fff;
    color:var(--ink);font-size:15px;cursor:pointer;display:grid;place-items:center;
    box-shadow:0 2px 6px rgba(59,36,18,.08);transition:transform .12s, background .12s;
  }
  .qtool:hover{background:#f7e7cb;transform:scale(1.07)}
  .qtool:active{transform:scale(.95)}

  #avatar{width:min(450px,100%);height:min(445px,58vh);margin-top:0;cursor:pointer;overflow:visible;user-select:none}
  .bar-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:-8px;max-width:560px;z-index:2}
  .chip{font:inherit;font-size:12px;padding:4px 10px;border-radius:99px;border:2px solid var(--line);background:#fff;cursor:pointer;transition:all .15s}
  .chip:hover{background:var(--line)}

  /* Skins & Customization Studio Panel */
  .skins-panel{
    background:var(--card);border:3px solid var(--ink);border-radius:20px;
    display:none;flex-direction:column;min-height:0;overflow:hidden;
  }
  main.skins-open .skins-panel{display:flex}
  .skins-head{
    display:flex;align-items:center;justify-content:space-between;padding:11px 14px;
    border-bottom:2px solid var(--line);gap:8px;
  }
  .skins-head h2{margin:0;font-size:15.5px;display:flex;align-items:center;gap:6px}
  .save-outfit-btn{
    font:inherit;font-size:11.5px;font-weight:600;background:var(--purple);color:#fff;
    border:none;border-radius:99px;padding:6px 11px;cursor:pointer;letter-spacing:.3px;
  }
  .save-outfit-btn:hover{background:var(--purple-dark)}
  .skins-tabs{display:flex;gap:5px;padding:8px 12px;border-bottom:1.5px dashed var(--line);flex-wrap:wrap}
  .stab{
    font:inherit;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;
    border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
  }
  .stab.active{background:var(--purple);color:#fff;border-color:var(--purple)}
  .skins-body{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:12px}
  .cat-block h3{margin:0 0 6px;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
  .cat-block h3 span{color:#8c6a43;font-weight:500}
  .swatch-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .swatch{
    aspect-ratio:1;border-radius:11px;border:2px solid var(--line);background:#fff;
    cursor:pointer;display:grid;place-items:center;font-size:18px;position:relative;
    transition:transform .12s, border-color .12s;padding:0;
  }
  .swatch:hover{transform:translateY(-2px);border-color:#b58c56}
  .swatch.selected{border:2.5px solid var(--purple);background:#f6efff;box-shadow:0 2px 6px rgba(111,45,189,.2)}
  .swatch.selected::after{
    content:"✓";position:absolute;top:-5px;right:-5px;width:15px;height:15px;border-radius:50%;
    background:var(--purple);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;
  }
  .color-dot{width:24px;height:24px;border-radius:7px;border:1.5px solid rgba(0,0,0,.2)}
  .saved-card{
    display:flex;align-items:center;justify-content:space-between;padding:8px 10px;
    border-radius:12px;border:2px solid var(--line);background:#fff;font-size:13px;
  }
  .saved-card button{font:inherit;font-size:11.5px;padding:3px 9px;border-radius:99px;border:1.5px solid var(--ink);background:#ffe9c2;cursor:pointer}

  /* Chat Panel */
  .side{background:var(--card);border:3px solid var(--ink);border-radius:20px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .side-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:2px dashed var(--line)}
  .side-head h2{margin:0;font-size:15px}
  #memTag{font-size:11px;color:#7a5430;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  #log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .msg{padding:8px 12px;border-radius:14px;font-size:14px;max-width:88%;line-height:1.35;white-space:pre-wrap}
  .msg.you{align-self:flex-end;background:#ffe1b0}
  .msg.bot{align-self:flex-start;background:#fff;border:2px solid var(--line)}
  form{display:flex;gap:8px;padding:12px;border-top:2px dashed var(--line)}
  #input{flex:1;font:inherit;font-size:14.5px;padding:9px 13px;border-radius:99px;border:2px solid var(--ink);background:#fff;outline:none;min-width:0}
  #input:focus{box-shadow:0 0 0 3px #f3c98a}
  .btn{font:inherit;border:2px solid var(--ink);background:var(--box);color:#fff;border-radius:99px;padding:0 14px;cursor:pointer;font-weight:500}
  .btn:disabled{opacity:.5;cursor:default}
  #mic{width:42px;padding:0;background:#fff;color:var(--ink);font-size:17px;transition:transform .1s;flex-shrink:0}
  #mic.rec{background:var(--accent);color:#fff;animation:pulse 1s infinite}
  #mic.standby{background:#e6f7ed;border-color:#2a9d5c}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(214,40,40,.25)}}
  @media (max-width:1050px){
    main, main.skins-open{grid-template-columns:1fr;grid-template-rows:auto}
    .nav-rail{flex-direction:row;justify-content:center}
    #avatar{height:330px}
  }

  /* ---------- avatar parts ---------- */
  #bodyIdle,#bodyAct,#bodyLean{transform-origin:200px 392px}
  #bodyIdle{animation:breathe 3.2s ease-in-out infinite}
  #bodyLean{transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
  svg.lean-question #bodyLean{transform:rotate(-5.5deg) translateY(-2px)}

  .eye,.brow{transform-box:fill-box;transform-origin:center;transition:transform .22s cubic-bezier(.3,1.6,.5,1)}
  .pupilg{transition:transform .12s ease-out}
  .eyeball,.pupilg,.arc,.sleeparc,.hearteye,.cheek,.fx,#tongue,.cos-item{transition:opacity .2s, transform .25s cubic-bezier(.3,1.5,.5,1)}
  .arc,.sleeparc,.hearteye,.cheek,.fx,#talkGroup{opacity:0}
  #mouth{transition:opacity .08s}

  .cos-item{opacity:0;pointer-events:none}
  .cos-item.on{opacity:1}

  svg.e-happy .eyeball, svg.e-happy .pupilg, svg.e-laugh .eyeball, svg.e-laugh .pupilg,
  svg.e-sleepy .eyeball, svg.e-sleepy .pupilg, svg.e-love .eyeball, svg.e-love .pupilg,
  svg.e-wink #eyeR .eyeball, svg.e-wink #eyeR .pupilg{opacity:0}
  svg.e-happy .arc, svg.e-laugh .arc, svg.e-wink #eyeR .arc{opacity:1}
  svg.e-sleepy .sleeparc{opacity:1}
  svg.e-love .hearteye{opacity:1;animation:heartbeat .8s ease-in-out infinite}
  svg.e-happy .cheek, svg.e-excited .cheek, svg.e-love .cheek, svg.e-laugh .cheek, svg.e-wink .cheek, svg.e-angry .cheek{opacity:.85}
  svg.e-excited #tongue, svg.e-laugh #tongue, svg.e-wink #tongue{opacity:1}
  #tongue{opacity:0}
  svg.talking #mouth, svg.talking #tongue{opacity:0}
  svg.talking #talkGroup{opacity:1}

  svg.e-sleepy .fx-zzz, svg.e-confused .fx-q, svg.e-surprised .fx-excl, svg.e-thinking .fx-dots,
  svg.e-love .fx-hearts, svg.e-excited .fx-sparkle, svg.e-sad .fx-tear, svg.e-angry .fx-vein,
  svg.e-listening .fx-wave, svg.hard-q .fx-sweat{opacity:1}

  .z{font:600 28px 'Fredoka',sans-serif;fill:#5a7bd6;animation:zfloat 2.4s ease-in infinite}
  .z2{animation-delay:.8s}.z3{animation-delay:1.6s}
  .qm,.ex{font:600 54px 'Fredoka',sans-serif;transform-box:fill-box;transform-origin:center}
  .qm{fill:#7b5cd6;animation:wobble 1.2s ease-in-out infinite}
  .ex{fill:#e11d2e;animation:popin .4s cubic-bezier(.3,1.8,.5,1)}
  .dot{fill:#3b2412;animation:dots 1.2s infinite}
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  .heart{animation:rise 2s ease-out infinite}
  .h2{animation-delay:.6s}.h3{animation-delay:1.2s}
  .star{transform-box:fill-box;transform-origin:center;animation:twinkle 1s ease-in-out infinite}
  .s2{animation-delay:.25s}.s3{animation-delay:.5s}.s4{animation-delay:.75s}
  .tear{animation:tear 1.6s ease-in infinite}
  .sweat{animation:sweatDrop 1.4s ease-in-out infinite}
  .vein{animation:vein .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  .wave{fill:none;stroke:#d62828;stroke-width:4;stroke-linecap:round;animation:wave 1s ease-in-out infinite}
  .wave:nth-child(2){animation-delay:.2s}.wave:nth-child(3){animation-delay:.4s}
  #peel{transform-box:fill-box;transform-origin:0% 100%;animation:peel 2.2s ease-in-out infinite}
  svg.e-angry #peel{animation:peelAngry .35s ease-in-out infinite}

  svg.a-happy #bodyAct{animation:hop 1.1s ease-in-out infinite}
  svg.a-bounce #bodyAct{animation:hop .6s ease-in-out infinite}
  svg.a-shake #bodyAct{animation:shake .12s linear infinite}
  svg.a-rage #bodyAct{animation:shake .07s linear infinite}
  svg.a-tilt #bodyAct{animation:tilt 2s ease-in-out infinite}
  svg.a-think #bodyAct{animation:thinkSearch 2.4s ease-in-out infinite}
  svg.a-sink #bodyAct{transform:scale(1,.95);animation:sink 3s ease-in-out infinite}
  svg.a-pop #bodyAct{animation:pop .6s ease-out 1}
  svg.a-sleep #bodyAct{animation:sleep 4s ease-in-out infinite}
  svg.a-talk #bodyAct{animation:talkbob .35s ease-in-out infinite}
  svg.a-listen #bodyAct{animation:listen 1s ease-in-out infinite}
  svg.poke #bodyIdle{animation:squish .45s ease-out 1}
  svg.a-happy #shadow,svg.a-bounce #shadow{animation:shadowhop .6s ease-in-out infinite}

  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.988)}}
  @keyframes hop{0%,100%{transform:translateY(0) scale(1.03,.95)}45%{transform:translateY(-16px) scale(.97,1.04)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-1deg)}75%{transform:translateX(4px) rotate(1deg)}}
  @keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes thinkSearch{0%,100%{transform:rotate(-4deg) translateY(-1px)}50%{transform:rotate(4deg) translateY(0)}}
  @keyframes sink{0%,100%{transform:scale(1,.95) translateY(2px)}50%{transform:scale(1.01,.93) translateY(4px)}}
  @keyframes pop{0%{transform:translateY(0)}35%{transform:translateY(-20px) scale(.96,1.05)}100%{transform:translateY(0)}}
  @keyframes sleep{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
  @keyframes talkbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes listen{0%,100%{transform:scale(1.02,1.02)}50%{transform:scale(1.04,1.0)}}
  @keyframes squish{0%{transform:scale(1,1)}30%{transform:scale(1.14,.82)}65%{transform:scale(.94,1.1)}100%{transform:scale(1,1)}}
  @keyframes shadowhop{0%,100%{transform:scale(1)}45%{transform:scale(.8)}}
  #shadow{transform-box:fill-box;transform-origin:center}
  @keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  @keyframes zfloat{0%{transform:translate(0,10px);opacity:0}30%{opacity:1}100%{transform:translate(16px,-22px);opacity:0}}
  @keyframes wobble{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
  @keyframes popin{0%{transform:scale(0)}100%{transform:scale(1)}}
  @keyframes dots{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}
  @keyframes rise{0%{transform:translateY(16px) scale(.5);opacity:0}25%{opacity:1}100%{transform:translateY(-26px) scale(1.15);opacity:0}}
  @keyframes twinkle{0%,100%{transform:scale(.3) rotate(0);opacity:.3}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
  @keyframes tear{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(60px);opacity:0}}
  @keyframes sweatDrop{0%{transform:translateY(-4px) scale(.85);opacity:0}25%{opacity:1}85%{transform:translateY(26px) scale(1.05);opacity:1}100%{transform:translateY(34px);opacity:0}}
  @keyframes vein{to{transform:scale(1.3)}}
  @keyframes wave{0%,100%{opacity:.2}50%{opacity:1}}
  @keyframes peel{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
  @keyframes peelAngry{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-34deg)}}
</style>
</head>
<body>
<header>
  <h1>Box<span>Bot</span></h1>
  <div id="status" class="pill">Ready</div>
  <select id="langSelect" title="Choose BoxBot's reply and voice language">
    <option value="auto">🌐 Auto Language</option>
    <option value="en">🇬🇧 English</option>
    <option value="ta">🇮🇳 தமிழ் (Tamil)</option>
    <option value="hi">🇮🇳 हिन्दी (Hindi)</option>
    <option value="es">🇪🇸 Español</option>
    <option value="fr">🇫🇷 Français</option>
    <option value="ja">🇯🇵 日本語</option>
    <option value="ko">🇰🇷 한국어</option>
    <option value="de">🇩🇪 Deutsch</option>
    <option value="ar">🇸🇦 العربية</option>
  </select>
  <div class="spacer"></div>
  <label class="toggle" title="Say 'Hey Box' anytime or speak after clicking mic—auto-stops when you finish">
    <input type="checkbox" id="handsFreeToggle"> Hands-free ("Hey Box")
  </label>
  <label class="toggle"><input type="checkbox" id="voiceToggle" checked> Voice reply</label>
</header>

<main id="mainGrid" class="skins-open">
  <!-- Left Navigation Rail -->
  <nav class="nav-rail" aria-label="BoxBot Modes">
    <button type="button" class="nav-btn" data-nav="chat"><span class="nav-ico">💬</span> Chat</button>
    <button type="button" class="nav-btn active" data-nav="skins"><span class="nav-ico">👕</span> Skins</button>
    <button type="button" class="nav-btn" data-nav="collection"><span class="nav-ico">📚</span> Collection</button>
    <button type="button" class="nav-btn" data-nav="randomize"><span class="nav-ico">🎲</span> Randomize</button>
  </nav>

  <!-- Center Stage -->
  <section class="stage">
    <div id="bubble">Hi! I'm BoxBot. Ask me anything, pick a language up top, or customize my outfit!</div>

    <div class="stage-mid">
      <!-- Quick Undo / Redo / Reset / Shuffle tools -->
      <div class="quick-tools">
        <button type="button" class="qtool" id="btnUndo" title="Undo outfit change">↩️</button>
        <button type="button" class="qtool" id="btnRedo" title="Redo outfit change">↪️</button>
        <button type="button" class="qtool" id="btnResetOutfit" title="Reset to classic cardboard">🔄</button>
        <button type="button" class="qtool" id="btnShuffleOutfit" title="Randomize outfit">🔀</button>
      </div>

      <svg id="avatar" viewBox="10 15 390 425" class="e-happy" aria-label="BoxBot cardboard box avatar">
        <defs>
          <clipPath id="frontClip"><rect x="60" y="130" width="260" height="260" rx="3"/></clipPath>
          <clipPath id="mouthClip"><path id="mouthClipPath" d=""/></clipPath>
          <clipPath id="talkClip"><path id="talkClipPath" d="M 182 280 Q 200 276 218 280 Q 218 286 200 286 Q 182 286 182 280 Z"/></clipPath>
          <pattern id="corr" width="8" height="8" patternUnits="userSpaceOnUse">
            <line x1="0" y1="4" x2="8" y2="4" stroke="#000" stroke-opacity=".06" stroke-width="2"/>
          </pattern>
          <pattern id="woodGrain" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M0 6 Q12 2 24 6 M0 18 Q12 22 24 18" fill="none" stroke="#4a2c11" stroke-width="1.5" stroke-opacity=".28"/>
          </pattern>
          <pattern id="spiderWeb" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M0 0 L40 40 M40 0 L0 40 M20 0 L20 40 M0 20 L40 20" stroke="#111" stroke-width="1.2" stroke-opacity=".25"/>
          </pattern>
          <linearGradient id="tapeSheen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
            <stop offset=".5" stop-color="#fff" stop-opacity=".05"/>
            <stop offset="1" stop-color="#fff" stop-opacity=".3"/>
          </linearGradient>
        </defs>

        <ellipse id="shadow" cx="208" cy="428" rx="150" ry="13" fill="#000" opacity=".18"/>

        <g id="bodyIdle"><g id="bodyAct"><g id="bodyLean">
          <!-- feet -->
          <rect id="footL" x="105" y="384" width="56" height="18" rx="9" fill="#6b4a2a"/>
          <rect id="footR" x="235" y="384" width="56" height="18" rx="9" fill="#6b4a2a"/>

          <!-- box faces (dynamically colored by skin/color selection) -->
          <polygon id="boxSide" points="320,130 360,92 360,352 320,390" fill="#a97b43"/>
          <polygon points="320,130 360,92 360,352 320,390" fill="url(#corr)"/>
          <polygon id="boxTop" points="60,130 100,92 360,92 320,130" fill="#dcb67e"/>
          <polygon points="60,130 100,92 360,92 320,130" fill="url(#corr)"/>
          <line x1="80" y1="111" x2="340" y2="111" stroke="#8a6232" stroke-width="2" stroke-opacity=".6"/>
          <rect id="boxFront" x="60" y="130" width="260" height="260" rx="3" fill="#c99a5b"/>
          <rect id="boxTex" x="60" y="130" width="260" height="260" rx="3" fill="url(#corr)"/>

          <!-- Theme / Superhero Front Overlays -->
          <g clip-path="url(#frontClip)">

/* ============ Web Audio SFX Engine (Poke, Tape Rip & All 12 Emotions) ============ */
let sfxCtx = null;
function getAudioCtx(){
  sfxCtx = sfxCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (sfxCtx.state === 'suspended') sfxCtx.resume();
  return sfxCtx;
}

function playTone(ctx, type, freqs, times, gainPeak = 0.2, delay = 0){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  const start = ctx.currentTime + delay;
  osc.frequency.setValueAtTime(freqs[0], start);
  for (let i = 1; i < freqs.length; i++) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqs[i]), start + times[i]);
  }
  const end = start + times[times.length - 1];
  gain.gain.setValueAtTime(0.001, start);
  gain.gain.linearRampToValueAtTime(gainPeak, start + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, end);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(start); osc.stop(end + 0.02);
}

function playCardboardPokeSound(){
  try {
    const ctx = getAudioCtx();
    playTone(ctx, 'triangle', [165, 68], [0, 0.14], 0.42);
    playTone(ctx, 'sine', [520, 980, 740], [0, 0.06, 0.15], 0.16, 0.02);
  } catch(e){}
}

function playTapeRipSound(){
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const dur = 0.42;
    const bufferSize = Math.floor(ctx.sampleRate * dur);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      const burst = Math.sin(i * 0.055) > 0.2 ? 1.0 : 0.35;
      data[i] = (Math.random() * 2 - 1) * burst;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(2100, now);
    filter.frequency.exponentialRampToValueAtTime(3800, now + dur * 0.7);
    filter.frequency.exponentialRampToValueAtTime(1600, now + dur);
    filter.Q.value = 2.8;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.01, now);
    gain.gain.linearRampToValueAtTime(0.26, now + 0.05);
    gain.gain.setValueAtTime(0.22, now + dur * 0.75);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    noise.start(now); noise.stop(now + dur);
  } catch(e){}
}

function playEmotionSound(emo){
  try {
    const ctx = getAudioCtx();
    switch (emo) {
      case 'neutral':
        playTone(ctx, 'triangle', [220, 290], [0, 0.12], 0.22);
        break;
      case 'happy':
        playTone(ctx, 'sine', [523.25, 523.25], [0, 0.14], 0.18, 0);
        playTone(ctx, 'sine', [659.25, 659.25], [0, 0.14], 0.18, 0.09);
        playTone(ctx, 'sine', [783.99, 783.99], [0, 0.22], 0.20, 0.18);
        break;
      case 'excited':
        [523, 659, 784, 1046, 1318].forEach((f, i) =>
          playTone(ctx, 'triangle', [f, f * 1.04], [0, 0.12], 0.18, i * 0.055)
        );
        break;
      case 'laugh':
        [440, 520, 460, 560, 490].forEach((f, i) =>
          playTone(ctx, 'sine', [f, f * 1.25, f * 0.9], [0, 0.04, 0.09], 0.2, i * 0.095)
        );
        break;
      case 'sad':
        playTone(ctx, 'sine', [440, 370, 293.66], [0, 0.25, 0.55], 0.22);
        break;
      case 'surprised':
        playTone(ctx, 'sine', [280, 960, 780], [0, 0.14, 0.26], 0.24);
        break;
      case 'thinking':
        playTone(ctx, 'sine', [420, 460], [0, 0.14], 0.16, 0);
        playTone(ctx, 'sine', [540, 580], [0, 0.18], 0.16, 0.18);
        break;
      case 'angry':
        playTapeRipSound();
        playTone(ctx, 'sawtooth', [150, 105], [0, 0.3], 0.15, 0.05);
        break;
      case 'sleepy':
        playTone(ctx, 'sine', [360, 270, 195], [0, 0.35, 0.7], 0.17);
        break;
      case 'love':
        playTone(ctx, 'sine', [587.33, 880], [0, 0.24], 0.18, 0);
        playTone(ctx, 'sine', [659.25, 987.77], [0, 0.34], 0.18, 0.16);
        break;
      case 'confused':
        playTone(ctx, 'triangle', [330, 290, 490], [0, 0.15, 0.36], 0.2);
        break;
      case 'wink':
        playTone(ctx, 'sine', [880, 1318.5], [0, 0.14], 0.18, 0);
        playTone(ctx, 'sine', [1568, 1568], [0, 0.18], 0.14, 0.07);
        break;
    }
  } catch(e){}
}

let hovering = false, hoverT = 0;

  if (S.emotion === 'thinking') return;
  const r = svg.getBoundingClientRect();
  const dx = (ev.clientX - (r.left + r.width/2)) / r.width;
  const dy = (ev.clientY - (r.top + r.height*.45)) / r.height;
  S.gaze = [Math.max(-8, Math.min(8, dx*30)), Math.max(-6, Math.min(6, dy*22))];
  hovering = true; clearTimeout(hoverT); hoverT = setTimeout(()=>hovering=false, 2500);
  render();
});

/* poke the box */

svg.addEventListener('click', () => {
  touch();
  if (S.busy) return;
  pokes++; clearTimeout(pokeReset); pokeReset = setTimeout(()=>pokes=0, 2500);
  svg.classList.remove('poke'); void svg.getBoundingClientRect(); svg.classList.add('poke');

      wink:'You found my secret poke spot.'

/* ============ Speech + Phoneme-Shaped Lip-Sync ============ */
let audioCtx = null, analyser = null, timeData = null, freqData = null, currentCancel = null;
let smOpen = 0, smWidth = 0.5, smRound = 0;

function setMouthViseme(open, width, round){
  const halfW = 14 + width * 16 - round * 8;
  const topY = 276 - open * 6;
  const botY = 282 + open * 28;
  const ctrlTopY = topY - (round * 4) + (width * 2);
  const ctrlBotY = botY + (round * 6);

  const d = `M ${200 - halfW} ${topY + 3} Q 200 ${ctrlTopY} ${200 + halfW} ${topY + 3} Q ${200 + halfW * 0.92} ${ctrlBotY} 200 ${ctrlBotY} Q ${200 - halfW * 0.92} ${ctrlBotY} ${200 - halfW} ${topY + 3} Z`;
  talkFill.setAttribute('d', d);
  talkStroke.setAttribute('d', d);
  talkClipPath.setAttribute('d', d);

  talkTeeth.setAttribute('y', topY - 2);
  talkTeeth.setAttribute('opacity', open > 0.25 && round < 0.5 ? 1 : 0);
  talkTongue.setAttribute('cy', botY - 4);
  talkTongue.setAttribute('rx', Math.max(8, halfW * 0.65));
  talkTongue.setAttribute('opacity', open > 0.35 ? 1 : 0);
}

function mouthLoop(){
  if (!S.talking) return;
  let targetOpen = 0, targetWidth = 0.5, targetRound = 0;

  if (analyser) {
    analyser.getByteTimeDomainData(timeData);
    analyser.getByteFrequencyData(freqData);

    let sum = 0;
    for (const v of timeData) { const d = (v - 128) / 128; sum += d * d; }
    const rms = Math.sqrt(sum / timeData.length);
    targetOpen = Math.min(1, rms * 5.2);

    let lowE = 0, midE = 0, highE = 0;
    for (let i = 2; i < 14; i++) lowE += freqData[i];
    for (let i = 14; i < 36; i++) midE += freqData[i];
    for (let i = 36; i < 80; i++) highE += freqData[i];

    const totalE = lowE + midE + highE + 1;
    const lowRatio = lowE / totalE;
    const highRatio = highE / totalE;

    if (targetOpen < 0.12) {
      targetWidth = 0.35; targetRound = 0;
    } else if (highRatio > 0.26) {
      targetWidth = 0.95; targetRound = 0;
    } else if (lowRatio > 0.62 && targetOpen < 0.65) {
      targetWidth = 0.15; targetRound = 0.9;
    } else {
      targetWidth = 0.65; targetRound = 0.15;
    }
  } else {
    const t = performance.now();
    targetOpen = 0.3 + 0.5 * Math.abs(Math.sin(t / 105));
    targetWidth = 0.5 + 0.4 * Math.sin(t / 170);
    targetRound = Math.max(0, Math.cos(t / 230)) * 0.7;
  }

  smOpen += (targetOpen - smOpen) * 0.5;
  smWidth += (targetWidth - smWidth) * 0.4;
  smRound += (targetRound - smRound) * 0.4;
  setMouthViseme(smOpen, smWidth, smRound);

  requestAnimationFrame(mouthLoop);
}

function startTalking(){ S.talking = true; render(); requestAnimationFrame(mouthLoop); }
function stopTalking(){ S.talking = false; smOpen = 0; render(); }
function stopSpeaking(){ if (currentCancel) { currentCancel(); currentCancel = null; } }

function typeText(text, ms){
  return new Promise(res => {
    let i = 0; bubble.classList.add('cursor');
    const t = setInterval(()=>{
      i++; bubble.textContent = text.slice(0,i); bubble.scrollTop = bubble.scrollHeight;
      if (i >= text.length) { clearInterval(t); bubble.classList.remove('cursor'); res(); }
    }, ms);
    currentCancel = ()=>{ clearInterval(t); bubble.textContent = text; bubble.classList.remove('cursor'); res(); };
  });
}

async function playAudio(url, text){
  return new Promise(async res => {
    const audio = new Audio(url);
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      const src = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.45;
      timeData = new Uint8Array(analyser.fftSize);
      freqData = new Uint8Array(analyser.frequencyBinCount);
      src.connect(analyser); analyser.connect(audioCtx.destination);
    } catch(e){ analyser = null; }
    let typer;
    const done = ()=>{ clearInterval(typer); bubble.classList.remove('cursor'); bubble.textContent = text; analyser = null; stopTalking(); res(); };
    audio.onended = done; audio.onerror = done;
    currentCancel = ()=>{ audio.pause(); done(); };
    audio.onloadedmetadata = ()=>{
      const dur = isFinite(audio.duration) ? audio.duration : text.length*0.06;
      let i = 0; bubble.classList.add('cursor');
      typer = setInterval(()=>{
        i++; bubble.textContent = text.slice(0,i); bubble.scrollTop = bubble.scrollHeight;
        if(i>=text.length) clearInterval(typer);
      }, Math.max(15, dur*1000*0.92/text.length));
    };
    try { await audio.play(); startTalking(); } catch(e){ done(); }
  });
}

async function speak(text, emotion, lang, sequence = []){
  setEmotion(emotion);
  if (emotion === 'angry') playTapeRipSound();

  let url = null;
  if ($('voiceToggle').checked) {
    setStatus('Warming up voice…', 'live');
    try {
      const r = await fetch('/api/tts', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text, lang: lang || 'en'})});
      if (r.ok) url = URL.createObjectURL(await r.blob());
    } catch(e){}
  }
  addLog('bot', text);
  setStatus('Speaking…', 'live');

  let seqTimer = null;
  if (Array.isArray(sequence) && sequence.length > 0) {
    let idx = 0;
    const step = () => {
      const em = sequence[idx % sequence.length];
      setEmotion(em);
      if (em === 'angry') playTapeRipSound();
      idx++;
    };
    step();
    seqTimer = setInterval(step, 650);
  }

  if (url) { await playAudio(url, text); URL.revokeObjectURL(url); }
  else { startTalking(); await typeText(text, 28); stopTalking(); }

  if (seqTimer) clearInterval(seqTimer);
  currentCancel = null;
  await new Promise(r=>setTimeout(r, 900));
  S.hardQuestion = false;
  setEmotion('neutral');
}

/* ============ Chat & Question Reactions ============ */
function addLog(who, text){
  const d = document.createElement('div'); d.className = 'msg ' + who; d.textContent = text;
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
}

function looksHardOrQuestion(text){
  const isQuestion = /\?|\b(why|how|what|when|where|who|explain|solve|calculate|prove|write|code)\b/i.test(text);
  const isHard = text.length > 55 || /[\d+\-*/^=]{3,}|\b(quantum|algorithm|calculus|integral|complexity|theorem|paradox|code|python|debug)\b/i.test(text);
  return {isQuestion, isHard};
}

async function ask(text){
  text = text.trim(); if (!text) return;
  stopSpeaking(); stopTalking();
  touch(); S.busy = true; $('send').disabled = true;
  addLog('you', text);

  const {isQuestion, isHard} = looksHardOrQuestion(text);
  S.leanQuestion = isQuestion;
  S.hardQuestion = isHard;

  setStatus('Thinking…', 'live');
  setEmotion('thinking');
  bubble.textContent = '…';

  const selectedLang = $('langSelect').value || 'auto';
  let data;
  try {
    const r = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text, lang:selectedLang})
    });
    data = await r.json();
  } catch(e){
    data = {reply:"I can't reach my brain. Is the server running?", emotion:'sad', lang:'en', sequence:[], hard:false};
  }

  S.leanQuestion = false;
  S.hardQuestion = !!data.hard;
  updateMemoryTag(data.name, data.favorites);

  await speak(data.reply, data.emotion, data.lang, data.sequence);
  S.busy = false; $('send').disabled = false;
  lastActive = Date.now();
  restoreIdleStatus();
}

$('form').addEventListener('submit', ev => {
  ev.preventDefault();
  const v = $('input').value; $('input').value = '';
  ask(v);
});
$('input').addEventListener('input', touch);

$('memTag').addEventListener('click', async () => {
  if (!confirm("Erase BoxBot's memory of your name and favorites?")) return;
  await fetch('/api/memory/clear', {method:'POST'});
  updateMemoryTag('', []);
  bubble.textContent = "Poof! Fresh cardboard! Who are you again?";
  setEmotion('surprised');
  playEmotionSound('surprised');
});

/* ============ Hands-Free VAD + Wake Word ("Hey Box") + Cloud Whisper ============ */
let rec = null, chunks = [], recording = false;
let vadStream = null, vadCtx = null, vadAnalyser = null, vadRaf = null;
let wakeRec = null, handsFreeActive = false;

const handsFreeToggle = $('handsFreeToggle');
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

function restoreIdleStatus(){
  if (handsFreeToggle.checked) {
    setStatus('Listening for "Hey Box"…', 'wake');
    $('mic').classList.add('standby');
    startWakeWordListener();
  } else {
    setStatus('Ready', false);
    $('mic').classList.remove('standby');
  }
}

handsFreeToggle.addEventListener('change', () => {
  if (handsFreeToggle.checked) {
    if (!SpeechRec) {
      bubble.textContent = 'Your browser does not support background wake-word detection—use Chrome or Edge, or tap the mic for auto-stop recording!';
    }
    restoreIdleStatus();
  } else {
    stopWakeWordListener();
    $('mic').classList.remove('standby');
    if (!recording && !S.busy) setStatus('Ready', false);
  }
});

function startWakeWordListener(){
  if (!SpeechRec || !handsFreeToggle.checked || recording || S.busy || handsFreeActive) return;
  try {
    wakeRec = new SpeechRec();
    wakeRec.continuous = true;
    wakeRec.interimResults = true;
    wakeRec.lang = 'en-US';
    handsFreeActive = true;

    wakeRec.onresult = (ev) => {
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const transcript = ev.results[i][0].transcript.toLowerCase();
        if (/\b(hey|hi|okay)\s+(box|boxbot|bucks)\b/.test(transcript)) {
          stopWakeWordListener();
          touch();
          startAutoStopRecording(true);
          return;
        }
      }
    };

    wakeRec.onend = () => {
      handsFreeActive = false;
      if (handsFreeToggle.checked && !recording && !S.busy) {
        setTimeout(startWakeWordListener, 250);
      }
    };
    wakeRec.onerror = () => { handsFreeActive = false; };
    wakeRec.start();
  } catch(e){ handsFreeActive = false; }
}

function stopWakeWordListener(){
  handsFreeActive = false;
  if (wakeRec) {
    try { wakeRec.onend = null; wakeRec.stop(); } catch(e){}
    wakeRec = null;
  }
}

function cleanupVAD(){
  if (vadRaf) { cancelAnimationFrame(vadRaf); vadRaf = null; }
  if (vadCtx) { try { vadCtx.close(); } catch(e){} vadCtx = null; }
  if (vadStream) { vadStream.getTracks().forEach(t => t.stop()); vadStream = null; }
}

async function startAutoStopRecording(fromWakeWord = false){
  if (recording || S.busy) return;
  stopWakeWordListener();
  stopSpeaking();
  touch();

  try {
    vadStream = await navigator.mediaDevices.getUserMedia({audio:true});
    rec = new MediaRecorder(vadStream);
    chunks = [];
    let hasSpoken = false;
    let silenceStart = null;
    const recordStart = performance.now();

    vadCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = vadCtx.createMediaStreamSource(vadStream);
    vadAnalyser = vadCtx.createAnalyser();
    vadAnalyser.fftSize = 512;
    src.connect(vadAnalyser);
    const buf = new Uint8Array(vadAnalyser.fftSize);

    const checkSilence = () => {
      if (!recording) return;
      vadAnalyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (const v of buf) { const d = (v - 128) / 128; sum += d * d; }
      const rms = Math.sqrt(sum / buf.length);
      const now = performance.now();

      if (rms > 0.025) {
        hasSpoken = true;
        silenceStart = null;
      } else if (hasSpoken) {
        if (!silenceStart) silenceStart = now;
        if (now - silenceStart > 1300) {
          rec.stop();
          return;
        }
      } else if (now - recordStart > 6500) {
        rec.stop();
        return;
      }
      vadRaf = requestAnimationFrame(checkSilence);
    };

    rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    rec.onstop = async () => {
      recording = false;
      $('mic').classList.remove('rec');
      const mime = rec.mimeType || 'audio/webm';
      cleanupVAD();

      if (!hasSpoken) {
        setEmotion('neutral');
        if (fromWakeWord) bubble.textContent = "Yes? I'm here whenever you need me!";
        restoreIdleStatus();
        return;
      }
      const blob = new Blob(chunks, {type:mime});
      await transcribeAndAsk(blob, mime);
    };

    rec.start();
    recording = true;
    $('mic').classList.add('rec');
    setStatus('Listening… (auto-stops when you pause)', 'live');
    setEmotion('listening');
    bubble.textContent = fromWakeWord ? "I'm listening! Go ahead…" : "I'm listening…";
    vadRaf = requestAnimationFrame(checkSilence);
  } catch(e){
    cleanupVAD();
    bubble.textContent = 'I could not open the microphone. Please allow mic access (use http://127.0.0.1:8000).';
    setEmotion('sad');
  }
}

$('mic').addEventListener('click', async () => {
  touch();
  if (recording) { rec.stop(); return; }
  await startAutoStopRecording(false);
});

async function transcribeAndAsk(blob, mime){
  S.busy = true; setStatus('Understanding your voice…', 'live'); setEmotion('thinking'); bubble.textContent = '…';
  const ext = mime.includes('mp4') ? 'mp4' : mime.includes('ogg') ? 'ogg' : 'webm';
  const fd = new FormData(); fd.append('audio', blob, `speech.${ext}`);
  try {
    const r = await fetch('/api/transcribe', {method:'POST', body:fd});
    const j = await r.json();
    S.busy = false;
    const cleaned = (j.text || '').replace(/^(hey|hi|okay)\s+(box|boxbot|bucks)[,.\s!]*/i, '').trim();
    if (cleaned) { await ask(cleaned); return; }
    bubble.textContent = "I didn't catch that. Could you say it again?"; setEmotion('confused');
  } catch(e){
    bubble.textContent = 'My cloud ears had a hiccup. Check your Groq API key!'; setEmotion('sad');
  }
  S.busy = false;
  restoreIdleStatus();
  setTimeout(()=>{ if(!S.busy) setEmotion('neutral'); }, 2000);
}

/* ============ Boot & Welcome Back Greeting ============ */
async function init(){
  applyOutfit();
  render();
  try {
    const r = await fetch('/api/state');
    const st = await r.json();
    updateMemoryTag(st.name, st.favorites);

    if (st.name || (st.favorites && st.favorites.length)) {
      const who = st.name ? `, ${st.name}` : '';
      const favNote = st.favorites && st.favorites.length
        ? ` I still remember you like ${st.favorites.slice(-2).join(' and ')}!`
        : '';
      bubble.textContent = `Welcome back${who}!${favNote} Good to see you again!`;
      setEmotion('happy');
    }
  } catch(e){}
  setTimeout(()=>{ if(!S.busy) setEmotion('neutral'); }, 2200);
}
init();
